<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />

    <title>AZhoot — quizzes ao vivo para eventos, aulas e treinamentos</title>
    <meta
      name="description"
      content="AZhoot é uma plataforma de quizzes ao vivo. Crie um quiz, mostre o PIN e o público responde pelo celular — com ranking, pódio e relatório em tempo real. Comece grátis."
    />
    <link rel="canonical" href="https://azhoot.com.br/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="AZhoot" />
    <meta
      name="keywords"
      content="quiz ao vivo, quiz interativo, quiz com PIN, gamificação, quiz para eventos, quiz para aulas, quiz para treinamento, plataforma de quiz, enquete ao vivo, kahoot alternativa"
    />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="AZhoot" />
    <meta property="og:url" content="https://azhoot.com.br/" />
    <meta property="og:title" content="AZhoot — quizzes ao vivo, de A a Z" />
    <meta
      property="og:description"
      content="Transforme qualquer apresentação em um jogo ao vivo. O público responde pelo celular com um PIN — ranking, pódio e relatório na hora. Comece grátis."
    />
    <meta property="og:image" content="https://azhoot.com.br/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://azhoot.com.br/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AZhoot — quizzes ao vivo, de A a Z" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AZhoot — quizzes ao vivo, de A a Z" />
    <meta
      name="twitter:description"
      content="Crie um quiz, mostre o PIN e o público responde pelo celular. Ranking, pódio e relatório ao vivo."
    />
    <meta name="twitter:image" content="https://azhoot.com.br/og-image.jpg" />
    <meta name="twitter:image:alt" content="AZhoot — quizzes ao vivo, de A a Z" />

    <!-- Dados estruturados (SEO + GEO/IA) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://azhoot.com.br/#organization",
            "name": "AZhoot",
            "url": "https://azhoot.com.br/",
            "logo": "https://azhoot.com.br/og-image.jpg",
            "description": "Plataforma brasileira de quizzes e apresentações interativas ao vivo."
          },
          {
            "@type": "WebSite",
            "@id": "https://azhoot.com.br/#website",
            "url": "https://azhoot.com.br/",
            "name": "AZhoot",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://azhoot.com.br/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "AZhoot",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://azhoot.com.br/",
            "inLanguage": "pt-BR",
            "description": "AZhoot é uma plataforma de quizzes ao vivo em que o apresentador cria um quiz, compartilha um PIN e o público responde pelo celular, com ranking, pódio e relatório em tempo real.",
            "featureList": [
              "Quizzes ao vivo com PIN e QR Code",
              "Participação pelo celular sem instalar app",
              "Perguntas de única escolha, múltipla escolha, verdadeiro/falso e enquete",
              "Ranking e pódio em tempo real",
              "Relatórios com exportação em CSV e XLSX",
              "Geração de perguntas com inteligência artificial"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "BRL",
              "description": "Plano gratuito disponível."
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "O que é o AZhoot?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O AZhoot é uma plataforma de quizzes ao vivo para eventos, aulas, treinamentos e reuniões. O apresentador cria um quiz e o público responde pelo celular usando um PIN, com ranking e pódio em tempo real."
                }
              },
              {
                "@type": "Question",
                "name": "Os participantes precisam instalar um aplicativo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. Os participantes entram pelo navegador do celular informando o PIN e um apelido — sem instalar nada e sem criar conta."
                }
              },
              {
                "@type": "Question",
                "name": "O AZhoot é gratuito?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim, há um plano gratuito. Também existem planos pagos (mensal e anual) com mais quizzes, mais participantes e mais recursos."
                }
              },
              {
                "@type": "Question",
                "name": "Dá para gerar perguntas com inteligência artificial?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. O AZhoot gera perguntas com IA a partir de um tema ou de documentos e imagens anexados, consumindo créditos."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O AZhoot precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
